settings:
  APP_DISPLAY_NAME: POND
  PRODUCTION_APP_NAME: POND
  APP_GROUP_IDENTIFIER: group.$(BASE_BUNDLE_IDENTIFIER)
  BASE_BUNDLE_IDENTIFIER: com.matchahoneylatte.matcha
  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "colors/accent-color"
  # matcha: your Apple team ID, read when the project is generated (`MATCHA_TEAM_ID=<team ID> xcodegen`). Simulator builds need none.
  DEVELOPMENT_TEAM: ${MATCHA_TEAM_ID}
  IS_NIGHTLY_BUILD: false

  # matcha: no Element Classic migration. Its app group and keychain group belong to Element's team and break provisioning.
